name: corpus-integrity
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, after the maintainer's Monday snapshot window

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus snapshot
        run: python3 scripts/validate_corpus.py
